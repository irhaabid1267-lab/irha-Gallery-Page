<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

        </div>

        <div class="item">
            <img src="images/image 3.jpeg" alt="Flowers">

        </div>

        <div class="item">

            <h3>Beach</h3>
        </div>

        <div class="item">
            <img src="images/image 5.jpeg" alt="Sunset">
            <h3>Sunset</h3>
        </div>

        <div class="item">
            <img src="images/image 6.jpeg" alt="Forest">
            <h3>Forest</h3>
        </div>

        <div class="item">
            <img src="images/image 7.jpeg" alt="Sky">
            <h3>Sky</h3>
        </div>

        <div class="item">
            <img src="images/image 8.jpeg" alt="Lake">
            <h3>Lake</h3>
        </div>

    <footer>
        <p>My Image Gallery | 2026</p>
    </footer>

</html>
